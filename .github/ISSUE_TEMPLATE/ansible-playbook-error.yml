name: "🛠️ Ansible Playbook - Erro de execução"
description: "Reporte uma falha ocorrida durante a execução de um playbook Ansible"
title: "[ANSIBLE ERROR]: "
labels: ["bug", "ansible", "triage"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Reporte de erro no Ansible
        Obrigado por reportar! Preencha os campos abaixo para nos ajudar a diagnosticar o problema.

  - type: input
    id: playbook
    attributes:
      label: "📄 Playbook que falhou"
      description: "Caminho relativo do playbook executado"
      placeholder: "ex: playbooks/deploy-app.yml"
    validations:
      required: true

  - type: input
    id: task_name
    attributes:
      label: "⚙️ Nome da task com erro"
      description: "Nome da task que apresentou falha"
      placeholder: "ex: Install required packages"
    validations:
      required: true

  - type: input
    id: incident_number
    attributes:
      label: "🎫 Número do incidente"
      description: "Número do incidente ou ticket associado"
      placeholder: "ex: INC-123456 ou TICKET-789"
    validations:
      required: true

  - type: input
    id: affected_servers
    attributes:
      label: "🖥️ Servidor(es) afetado(s)"
      description: "Hostname ou IP do(s) servidor(es) que apresentaram falha"
      placeholder: "ex: web-server-01, app-server-02 ou 192.168.1.10, 192.168.1.11"
    validations:
      required: true

  - type: textarea
    id: full_output
    attributes:
      label: "📜 Output completo do Ansible"
      description: "Cole aqui a saída completa do playbook (incluindo o erro)"
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: "✅ Verificações"
      description: "Confirme antes de enviar"
      options:
        - label: "Eu verifiquei que não existe outra issue igual a esta"
          required: true
        - label: "Eu removi informações sensíveis (senhas, chaves, IPs internos)"
          required: true
