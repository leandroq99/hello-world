- name: Configurar /etc/resolv.conf para usar DNS interno
  hosts: all
  become: yes
  vars:
    dns_primary: "172.89.0.50"
    dns_secondary: "10.0.2.3"
    dns_domain: "lab.local"
    dns_search_domains:
      - "lab.local"
      - "intelbras.local"
    resolv_options: "timeout:2 attempts:3"
  tasks:
    - name: Remover imutabilidade do /etc/resolv.conf (se existir)
      shell: chattr -i /etc/resolv.conf 2>/dev/null || true
      changed_when: false
    - name: Criar /etc/resolv.conf com a configuração correta
      copy:
        dest: /etc/resolv.conf
        content: |
          search {{ dns_search_domains | join(' ') }}
          nameserver {{ dns_primary }}
          nameserver {{ dns_secondary }}
          options {{ resolv_options }}
        owner: root
        group: root
        mode: '0644'
      register: resolv_config
    - name: Tornar /etc/resolv.conf imutável (evita sobrescrita)
      shell: chattr +i /etc/resolv.conf
      changed_when: false
      when: resolv_config.changed
    - name: Verificar conteúdo do /etc/resolv.conf
      command: cat /etc/resolv.conf
      register: resolv_output
      changed_when: false
    - name: Exibir /etc/resolv.conf
      debug:
        msg: "{{ resolv_output.stdout_lines }}"
    - name: Testar resolução do servidor DNS
      command: nslookup dns-server
      register: nslookup_output
      changed_when: false
      ignore_errors: yes
    - name: Exibir resultado do nslookup
      debug:
        msg: "{{ nslookup_output.stdout_lines }}"
      when: nslookup_output.rc == 0
    - name: Aviso se nslookup falhou
      debug:
        msg: "⚠️ Não foi possível resolver dns-server. Verifique a configuração."
      when: nslookup_output.rc != 0
    - name: Testar resolução de um host interno
      command: nslookup grafana
      register: nslookup_grafana
      changed_when: false
      ignore_errors: yes
    - name: Exibir resultado do nslookup grafana
      debug:
        msg: "{{ nslookup_grafana.stdout_lines }}"
      when: nslookup_grafana.rc == 0
