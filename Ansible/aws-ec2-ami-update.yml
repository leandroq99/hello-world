- name: AWS EC2 Snapshot, Template Creation, and Auto Scaling Management
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    ec2_instance_id: "i-xxxxxxxxxx" # ID da instância EC2
    asg_name: "my-auto-scaling-group"
    template_instance_id: "i-yyyyyyyyyy" # ID da instância template
    launch_template_name: "my-launch-template"
    snapshot_description: "Snapshot from Ansible playbook"
    ami_name: "template-ami-{{ ansible_date_time.iso8601_basic_short }}"
  tasks:
    - name: 1. Tira snapshot da instância EC2
      amazon.aws.ec2_snapshot:
        region: "{{ aws_region }}"
        instance_id: "{{ ec2_instance_id }}"
        snapshot_description: "{{ snapshot_description }}"
        wait: true
      register: snapshot_result
    - name: Debug - Snapshot criado
      debug:
        msg: "Snapshot ID: {{ snapshot_result.snapshot_id }}"
    - name: 2. Reduz Auto Scaling Group para 0 instâncias
      # Manages AWS Auto Scaling Groups (ASG)
      # This module is used to create, modify, or delete Auto Scaling Groups in AWS
      # It allows you to configure scaling policies, instance types, desired capacity, and other ASG parameters
      # Required parameters typically include: name, launch_config or launch_template, min_size, max_size, desired_capacity
      # Common use cases: scaling EC2 instances based on load, maintaining high availability, managing fleet capacity
      amazon.aws.autoscaling_group:
        name: "{{ asg_name }}"
        region: "{{ aws_region }}"
        desired_capacity: 0
        min_size: 0
        max_size: 0
      register: asg_scaling_down
    - name: Debug - ASG reduzido
      debug:
        msg: "Auto Scaling Group {{ asg_name }} reduzido para 0"
    - name: 3. Liga a instância template
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ template_instance_id }}"
        state: running
        region: "{{ aws_region }}"
        wait: true
      register: template_instance
    - name: Debug - Instância template ligada
      debug:
        msg: "Instância template {{ template_instance_id }} está rodando"
    - name: 4. Pausa para checkpoint (5 minutos para validações)
      pause:
        minutes: 5
        prompt: "Realize as validações necessárias na instância template. Pressione Enter para continuar..."
    - name: 5. Desliga a instância template
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ template_instance_id }}"
        state: stopped
        region: "{{ aws_region }}"
        wait: true
      register: template_stopped
    - name: Debug - Instância template desligada
      debug:
        msg: "Instância template {{ template_instance_id }} foi desligada"
    - name: 6. Cria AMI (imagem) da instância template
      amazon.aws.ec2_ami:
        instance_id: "{{ template_instance_id }}"
        name: "{{ ami_name }}"
        description: "AMI gerada automaticamente pelo Ansible"
        region: "{{ aws_region }}"
        wait: true
        root_device_name: /dev/xvda
      register: ami_result
    - name: Debug - AMI criada
      debug:
        msg: "AMI criada com sucesso: {{ ami_result.image_id }}"
    - name: 7a. Obtém informações do Launch Template
      amazon.aws.ec2_launch_template_info:
        launch_template_names:
          - "{{ launch_template_name }}"
        region: "{{ aws_region }}"
      register: launch_template_info
    - name: Debug - Launch Template info
      debug:
        msg: "Launch Template versão padrão: {{ launch_template_info.launch_templates[0].default_version_number }}"
    - name: 7b. Cria nova versão do Launch Template com a nova AMI
      amazon.aws.ec2_launch_template:
        launch_template_name: "{{ launch_template_name }}"
        image_id: "{{ ami_result.image_id }}"
        region: "{{ aws_region }}"
      register: new_launch_template_version
    - name: Debug - Nova versão do Launch Template criada
      debug:
        msg: "Nova versão criada: {{ new_launch_template_version.latest_version_number }}"
    - name: 7c. Define a nova versão como padrão
      amazon.aws.ec2_launch_template:
        launch_template_name: "{{ launch_template_name }}"
        default_version: "{{ new_launch_template_version.latest_version_number }}"
        region: "{{ aws_region }}"
      register: launch_template_default_updated
    - name: Debug - Versão padrão atualizada
      debug:
        msg: "Versão padrão do Launch Template atualizada para: {{ new_launch_template_version.latest_version_number }}"
    - name: 8. Reativa o Auto Scaling Group com as configurações originais
      amazon.aws.autoscaling_group:
        name: "{{ asg_name }}"
        region: "{{ aws_region }}"
        desired_capacity: 2 # Ajuste conforme sua necessidade
        min_size: 1
        max_size: 10
      register: asg_scaling_up
    - name: Debug - ASG reativado
      debug:
        msg: "Auto Scaling Group {{ asg_name }} foi reativado"
    - name: Resumo final da execução
      debug:
        msg: |
          ====================================
          RESUMO DA OPERAÇÃO
          ====================================
          1. Snapshot criado: {{ snapshot_result.snapshot_id }}
          2. ASG reduzido para 0
          3. Instância template ligada
          4. Checkpoint realizado
          5. Instância template desligada
          6. AMI criada: {{ ami_result.image_id }}
          7. Launch Template atualizado (versão: {{ new_launch_template_version.latest_version_number }})
          8. ASG reativado com a nova configuração
          ====================================
