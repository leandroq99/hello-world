- name: Configurar autenticação LDAP com nslcd
  hosts: "{{ target_hosts }}"
  become: yes
  vars:
    ldap_server: "ipa-ldap.lab.local"
    ldap_base_dn: "dc=ipa,dc=local"
    ldap_bind_dn: "cn=admin,dc=ipa,dc=local"
    ldap_bind_pw: "{{ ldap_bind_pw }}" # Deve ser passada via extra_vars
  tasks:
    - name: Instalar pacotes LDAP
      dnf:
        name:
          - epel-release
          - openldap-clients
          - nss-pam-ldapd
          - authselect
          - oddjob
          - oddjob-mkhomedir
        state: present
    - name: Criar usuário e grupo nslcd (se não existir)
      group:
        name: nslcd
        state: present
        system: yes
      ignore_errors: yes
    - name: Criar usuário nslcd
      user:
        name: nslcd
        group: nslcd
        system: yes
        create_home: no
      ignore_errors: yes
    - name: Configurar /etc/openldap/ldap.conf
      copy:
        dest: /etc/openldap/ldap.conf
        content: |
          BASE {{ ldap_base_dn }}
          URI ldap://{{ ldap_server }}
          TLS_REQCERT never
    - name: Configurar /etc/nslcd.conf
      no_log: true
      copy:
        dest: /etc/nslcd.conf
        mode: '0600'
        owner: nslcd
        group: nslcd
        content: |
          uri ldap://{{ ldap_server }}
          base {{ ldap_base_dn }}
          binddn {{ ldap_bind_dn }}
          bindpw {{ ldap_bind_pw }}
          ssl no
          tls_reqcert never
          filter passwd (objectClass=posixAccount)
          filter shadow (objectClass=posixAccount)
          filter group (objectClass=posixGroup)
          map passwd uidNumber uidNumber
          map passwd gidNumber gidNumber
    - name: Iniciar e habilitar nslcd
      systemd:
        name: nslcd
        state: started
        enabled: yes
    - name: Configurar /etc/nsswitch.conf
      copy:
        dest: /etc/nsswitch.conf
        content: |
          passwd:     files ldap
          shadow:     files ldap
          group:      files ldap
          hosts:      files dns myhostname
          services:   files
          netgroup:   files
          sudoers:    files
          automount:  files
    - name: Iniciar oddjobd (para criar home directories)
      systemd:
        name: oddjobd
        state: started
        enabled: yes
    - name: Configurar autenticação via authselect
      shell: authselect select nis with-mkhomedir --force
      ignore_errors: yes
    - name: Testar autenticação LDAP
      no_log: true
      command: id leandro
      register: id_test
      ignore_errors: yes
    - name: Resultado da autenticação
      debug:
        msg: "✅ Autenticação LDAP funcionando!"
      when: id_test.rc == 0
    - name: Aviso se usuário não existir
      debug:
        msg: "⚠️ Usuário 'leandro' não encontrado no LDAP."
      when: id_test.rc != 0
