- name: Install Zabbix Server 6.x
  hosts: zabbix-server
  become: true
  vars:
    zabbix_version: "6.0"
    zabbix_db_name: "zabbix"
    zabbix_db_user: "zabbix"
    zabbix_db_host: "localhost"
    zabbix_server_ip: "172.89.0.30"
  vars_files:
    - vars/secrets.yml
  tasks:
    # ========================
    # MySQL
    # ========================
    - name: Instalar MySQL Server
      dnf:
        name:
          - mysql-server
          - mysql
          - python3-PyMySQL
        state: present
    - name: Habilitar e iniciar o MySQL
      systemd:
        name: mysqld
        enabled: true
        state: started
    - name: Definir senha do root do MySQL
      mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        check_implicit_admin: true
        state: present
    - name: Criar banco de dados do Zabbix
      mysql_db:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: "{{ zabbix_db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_bin
        state: present
    - name: Criar usuário do Zabbix no MySQL
      mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        name: "{{ zabbix_db_user }}"
        password: "{{ zabbix_db_password }}"
        host: localhost
        priv: "{{ zabbix_db_name }}.*:ALL"
        state: present
    - name: Configurar log_bin_trust_function_creators
      mysql_variables:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        variable: log_bin_trust_function_creators
        value: 1
    # Repositório Zabbix
    # ========================
    - name: Adicionar repositório oficial do Zabbix 6.0
      # ========================

      dnf:
        name: "https://repo.zabbix.com/zabbix/6.0/rhel/9/x86_64/zabbix-release-6.0-4.el9.noarch.rpm"
        state: present
        disable_gpg_check: true
    - name: Limpar cache do dnf
      command: dnf clean all
    # Instalação do Zabbix
    # ========================
    - name: Instalar Zabbix Server, Frontend e Agent
      # ========================

      dnf:
        name:
          - zabbix-server-mysql
          - zabbix-web-mysql
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-selinux-policy
          - zabbix-agent
        state: present
        disablerepo: epel
    # Schema do banco
    # ========================
    - name: Verificar se o schema já foi importado
      # ========================

      mysql_query:
        login_user: "{{ zabbix_db_user }}"
        login_password: "{{ zabbix_db_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_db: "{{ zabbix_db_name }}"
        query: "SELECT COUNT(*) as count FROM information_schema.tables WHERE table_schema = '{{ zabbix_db_name }}'"
      register: db_tables
    - name: Importar schema do Zabbix
      shell: |
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | \
        mysql --default-character-set=utf8mb4 \
        -u{{ zabbix_db_user }} \
        -p{{ zabbix_db_password }} \
        {{ zabbix_db_name }}
      when: db_tables.query_result[0][0].count == 0
    - name: Desabilitar log_bin_trust_function_creators após import
      mysql_variables:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        variable: log_bin_trust_function_creators
        value: 0
    # Configuração Zabbix Server
    # ========================
    - name: Gerar configuração do Zabbix Server
      # ========================

      template:
        src: zabbix_server.conf.j2
        dest: /etc/zabbix/zabbix_server.conf
        owner: root
        group: zabbix
        mode: "0640"
      notify: Restart zabbix-server
    # Configuração Frontend
    # ========================
    - name: Gerar configuração do Frontend PHP
      # ========================

      template:
        src: zabbix.conf.php.j2
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: apache
        group: apache
        mode: "0644"
      notify: Restart httpd
    - name: Configurar timezone no PHP para o Zabbix
      lineinfile:
        path: /etc/php-fpm.d/zabbix.conf
        regexp: '^;?php_value\[date.timezone\]'
        line: 'php_value[date.timezone] = America/Sao_Paulo'
      notify: Restart php-fpm
    # SELinux
    # ========================
    - name: Permitir httpd conectar na rede (SELinux)
      # ========================

      seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
    # Firewall
    # ========================
    - name: Liberar porta do Zabbix Server no firewall
      # ========================

      firewalld:
        port: 10051/tcp
        permanent: true
        state: enabled
        immediate: true
    - name: Liberar porta do Zabbix Agent no firewall
      firewalld:
        port: 10050/tcp
        permanent: true
        state: enabled
        immediate: true
    - name: Liberar HTTP no firewall
      firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
    # Iniciar serviços
    # ========================
    - name: Habilitar e iniciar Zabbix Server
      # ========================

      systemd:
        name: zabbix-server
        enabled: true
        state: started
    - name: Habilitar e iniciar Zabbix Agent
      systemd:
        name: zabbix-agent
        enabled: true
        state: started
    - name: Habilitar e iniciar PHP-FPM
      systemd:
        name: php-fpm
        enabled: true
        state: started
    - name: Habilitar e iniciar Apache
      systemd:
        name: httpd
        enabled: true
        state: started
  handlers:
    - name: Restart zabbix-server
      systemd:
        name: zabbix-server
        state: restarted
    - name: Restart httpd
      systemd:
        name: httpd
        state: restarted
    - name: Restart php-fpm
      systemd:
        name: php-fpm
        state: restarted
