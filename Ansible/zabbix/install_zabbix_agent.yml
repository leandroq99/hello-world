- name: Install Zabbix Agent
  hosts: "{{ target_hosts | default('kubernetes_servers') }}"
  become: true
  vars:
    zabbix_server_ip: "172.89.0.30"
  tasks:
    # ========================
    # Repositório Zabbix
    # ========================
    - name: Adicionar repositório oficial do Zabbix 6.0
      dnf:
        name: "https://repo.zabbix.com/zabbix/6.0/rhel/9/x86_64/zabbix-release-6.0-4.el9.noarch.rpm"
        state: present
        disable_gpg_check: true
    - name: Limpar cache do dnf
      command: dnf clean all
    # ========================
    # Instalação do Agent
    # ========================
    - name: Instalar Zabbix Agent
      dnf:
        name: zabbix-agent
        state: present
        disablerepo: epel
    # ========================
    # Configuração
    # ========================
    - name: Gerar configuração do Zabbix Agent
      template:
        src: zabbix_agentd.conf.j2
        dest: /etc/zabbix/zabbix_agentd.conf
        owner: root
        group: zabbix
        mode: "0640"
      notify: Restart zabbix-agent
    # ========================
    # Firewall
    # ========================
    - name: Liberar porta do Zabbix Agent no firewall
      firewalld:
        port: 10050/tcp
        permanent: true
        state: enabled
        immediate: true
    # ========================
    # Iniciar serviço
    # ========================
    - name: Habilitar e iniciar Zabbix Agent
      systemd:
        name: zabbix-agent
        enabled: true
        state: started
  handlers:
    - name: Restart zabbix-agent
      systemd:
        name: zabbix-agent
        state: restarted
