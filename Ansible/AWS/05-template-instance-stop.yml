---
- name: AWS EC2 - Para Instância Template
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: "us-east-1"
    template_instance_id: "i-yyyyyyyyyy"  # ID da instância template

  tasks:
    - name: Desliga a instância template
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ template_instance_id }}"
        state: stopped
        region: "{{ aws_region }}"
        wait: true
      register: template_stopped

    - name: Exibe status da instância template
      debug:
        msg: "Instância template {{ template_instance_id }} foi desligada"

    - name: Aguarda desligamento completo
      pause:
        seconds: 30
